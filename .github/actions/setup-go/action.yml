name: "Setup Go"
description: "Install the pinned Go toolchain for Go projects"
inputs:
  go-version:
    description: "Go toolchain version. Keep it equal to the go directive of each Go module once a module exists."
    required: false
    default: "1.27.4"
  cache-dependency-path:
    description: "go.sum used as the module-cache key; empty leaves the setup-go cache off"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # setup-go owns the module cache and the build cache. Its cache is keyed on a dependency file, so caching
    # is on only when cache-dependency-path names one.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache-dependency-path != '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
