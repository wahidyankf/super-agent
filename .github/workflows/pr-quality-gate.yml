name: PR Quality Gate

# The server-side mirror of the local gates. A pull request can be opened from a checkout whose hooks never ran,
# so the guarantees the hooks enforce are checked again here. Every repository command runs through the pinned
# HIPPO wrapper, as it does locally.
#
# The single required status check is the quality-gate job at the bottom of this file. Branch protection names
# that one context, so adding or splitting a job below never means editing the ruleset.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected projects
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      has-go: ${{ steps.detect.outputs.has-go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # Each affected project's lang:* tag decides which language job runs. With no affected Go project, every Go
      # job is skipped. The aggregate below still requires detection to succeed.
      - id: detect
        name: Map affected projects to language tags
        shell: bash
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          has_go=false
          affected="$(./hippo run --class ephemeral --resource-tier light --disk-path . -- \
            npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD")"
          for project in $affected; do
            tags="$(./hippo run --class ephemeral --resource-tier light --disk-path . -- \
              npx nx show project "$project" --json | jq -r '.tags[]?')"
            for tag in $tags; do
              if [ "$tag" = "lang:go" ]; then
                has_go=true
              fi
            done
          done
          echo "has-go=${has_go}" >> "$GITHUB_OUTPUT"
          echo "Affected Go projects: ${has_go}"

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The pull request head, not the synthetic merge commit: the tree that would be published is the tree
      # that has to be screened.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # The shellcheck, shfmt, and actionlint gates call their binaries from PATH. A missing gate binary fails
      # rather than skips, so the pinned releases are installed before the lifecycle runs.
      - uses: ./.github/actions/setup-lint-tools

      # One typed lifecycle replay under the pinned RHINO. The base and head are the pull request's commits, so
      # the public-safety range scan and the commit-message scan see exactly the history the pull request adds.
      - name: Run the pull-request lifecycle under the pinned RHINO
        env:
          RHINO_BASE: ${{ github.event.pull_request.base.sha }}
          RHINO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request --base "$RHINO_BASE" --head "$RHINO_HEAD"

  go:
    name: Go quality gate (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each row selects its Nx projects by tag, so a Go module joins a row through its tags alone. Ubuntu runs every
          # Go project (lang:go) through the full set. A target runs only in the projects that declare it, so the
          # app-only targets run for the app. macOS runs the application (type:app) through the targets whose behaviour
          # depends on the platform: signals, exit statuses, the user configuration directory, atomic renames, file
          # modes, symbolic links, and port binding. The application's end-to-end and conformance suites run the built
          # binary, which includes the libraries, so they cover the libraries on macOS. The libraries' integration tests
          # use the real file system and processes, and they run on Ubuntu only, as the application's integration tests
          # do. Each row's tier follows its work. Ubuntu runs whole suites of seven projects, which is heavy work. macOS
          # runs one project's tests, which is standard work, and a macos-15 runner (3 CPUs, about 7 GiB) has less than
          # the heavy tier's minimum reservation of 4 CPUs and 8192 MiB.
          - os: ubuntu-24.04
            tier: heavy
            projects: "tag:lang:go"
            targets: "lint typecheck test:unit test:integration test:e2e test:conformance bdd:check deps:audit"
          - os: macos-15
            tier: standard
            projects: "tag:type:app"
            targets: "test:unit test:e2e test:conformance"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # The setup-go action checks the installed Go against the toolchain line of every go.mod, and keys the module
      # cache on every go.sum, so a library's dependencies are cached as the app's are.
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      # One HIPPO run admits the whole row, so its targets do not queue for capacity between themselves. A run
      # admitted between two targets can be deferred after the first one has loaded the host. Each target is one
      # run-many over the row's projects. A target skips the projects that do not declare it. A selector that matches
      # no project fails, so a renamed tag cannot pass without running anything.
      - name: Run the Go targets through Nx
        shell: bash
        env:
          PROJECTS: ${{ matrix.projects }}
          TARGETS: ${{ matrix.targets }}
          TIER: ${{ matrix.tier }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          # shellcheck disable=SC2016 # the inner bash expands its own arguments, so its script stays in single quotes
          ./hippo run --class ephemeral --resource-tier "$TIER" --disk-path . -- \
            bash -c '
              set -euo pipefail
              projects=$1
              shift
              selected="$(npx nx show projects --projects="$projects")"
              if [ -z "$selected" ]; then
                echo "No Nx project matches ${projects}" >&2
                exit 1
              fi
              echo "Nx projects for ${projects}:"
              printf "  %s\n" $selected
              for target in "$@"; do
                npx nx run-many --targets="$target" --projects="$projects" --parallel=1 --nxBail || exit $?
              done
            ' bash "$PROJECTS" "${targets[@]}"

  cross-compile:
    name: Cross-compile check
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          run-npm-ci: "false"

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      # Builds only. Binaries go under the runner's temporary directory, and nothing is uploaded or published. The app
      # is the only package built. Its go.mod replace directives name the libraries' folders in this checkout, so the
      # build resolves them from the working tree.
      - name: Cross-compile for the four release platforms
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/cross-compile
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
              env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go -C apps/retriever-cli build -trimpath -o "$OUT_DIR/retriever-${goos}-${goarch}" ./cmd/retriever
          done

  quality-gate:
    name: Quality gate
    # Only an explicit success from every required job may open the merge button. A skipped language job is a
    # pass only when detection found no project of that language; any other result fails the aggregate.
    needs: [detect, repository-policy, go, cross-compile]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DETECT_RESULT: ${{ needs.detect.result }}
      POLICY_RESULT: ${{ needs.repository-policy.result }}
      GO_RESULT: ${{ needs.go.result }}
      CROSS_RESULT: ${{ needs.cross-compile.result }}
      HAS_GO: ${{ needs.detect.outputs.has-go }}
    steps:
      - name: Check every gate
        shell: bash
        run: |
          set -euo pipefail
          echo "detect=${DETECT_RESULT} repository-policy=${POLICY_RESULT} go=${GO_RESULT}" \
            "cross-compile=${CROSS_RESULT} has-go=${HAS_GO}"
          if [ "${DETECT_RESULT}" != "success" ]; then
            echo "Affected-project detection did not succeed." >&2
            exit 1
          fi
          if [ "${POLICY_RESULT}" != "success" ]; then
            echo "Repository policy did not succeed." >&2
            exit 1
          fi
          if [ "${HAS_GO}" = "true" ]; then
            if [ "${GO_RESULT}" != "success" ]; then
              echo "The Go quality gate did not succeed." >&2
              exit 1
            fi
            if [ "${CROSS_RESULT}" != "success" ]; then
              echo "The cross-compile check did not succeed." >&2
              exit 1
            fi
          elif [ "${GO_RESULT}" != "skipped" ] || [ "${CROSS_RESULT}" != "skipped" ]; then
            echo "A Go job ran without an affected Go project." >&2
            exit 1
          fi
          echo "All quality gates passed."
