name: PR Quality Gate

# The server-side mirror of the local gates. A pull request can be opened from a checkout whose hooks never ran,
# so the guarantees the hooks enforce are checked again here. Every repository command runs through the pinned
# HIPPO wrapper, as it does locally.
#
# The registry's pull-request surface runs in one job, from the registry alone, so no job copies a gate's command.
# The test levels run as parallel jobs, one per Nx project and per level, and each project list comes from Nx
# itself. The behaviour corpus is checked once for the whole repository. The end-to-end level is not here: it runs
# in scheduled-e2e.yml, as the test and gate contract requires (rule C17).
#
# The single required status check is the quality-gate job at the bottom of this file. Branch protection names
# that one context, so adding or splitting a job below never means editing the ruleset.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected projects
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      has-go: ${{ steps.detect.outputs.has-go }}
      go-projects: ${{ steps.detect.outputs.go-projects }}
      unit-projects: ${{ steps.detect.outputs.unit-projects }}
      integration-projects: ${{ steps.detect.outputs.integration-projects }}
      conformance-projects: ${{ steps.detect.outputs.conformance-projects }}
      app-unit-projects: ${{ steps.detect.outputs.app-unit-projects }}
      app-conformance-projects: ${{ steps.detect.outputs.app-conformance-projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # Each affected project's lang:* tag decides whether the Go jobs run. With no affected Go project, every Go
      # job is skipped. The aggregate below still requires detection to succeed.
      #
      # The lists below are Nx's own answer to "which projects declare this target". A project that declares a
      # target joins its job with no edit here, and a project that drops one leaves its job. An empty list fails
      # its job, so a target that vanishes cannot pass without running anything.
      - id: detect
        name: Map affected projects to language tags and list the projects of each job
        shell: bash
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          has_go=false
          affected="$(./hippo run --class ephemeral --resource-tier light --disk-path . -- \
            npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD")"
          for project in $affected; do
            tags="$(./hippo run --class ephemeral --resource-tier light --disk-path . -- \
              npx nx show project "$project" --json | jq -r '.tags[]?')"
            for tag in $tags; do
              if [ "$tag" = "lang:go" ]; then
                has_go=true
              fi
            done
          done

          nx_list() {
            ./hippo run --class ephemeral --resource-tier light --disk-path . -- \
              npx nx show projects "$@" --json | jq -c .
          }
          go_projects="$(nx_list --projects='tag:lang:go')"
          unit_projects="$(nx_list --with-target test:unit)"
          integration_projects="$(nx_list --with-target test:integration)"
          conformance_projects="$(nx_list --with-target test:conformance)"
          app_unit_projects="$(nx_list --projects='tag:type:app' --with-target test:unit)"
          app_conformance_projects="$(nx_list --projects='tag:type:app' --with-target test:conformance)"

          {
            echo "has-go=${has_go}"
            echo "go-projects=${go_projects}"
            echo "unit-projects=${unit_projects}"
            echo "integration-projects=${integration_projects}"
            echo "conformance-projects=${conformance_projects}"
            echo "app-unit-projects=${app_unit_projects}"
            echo "app-conformance-projects=${app_conformance_projects}"
          } >> "$GITHUB_OUTPUT"
          echo "Affected Go projects: ${has_go}"
          echo "Go projects: ${go_projects}"

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The pull request head, not the synthetic merge commit: the tree that would be published is the tree
      # that has to be screened.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # The shellcheck, shfmt, and actionlint gates call their binaries from PATH. A missing gate binary fails
      # rather than skips, so the pinned releases are installed before the lifecycle runs.
      - uses: ./.github/actions/setup-lint-tools

      # The whole pull-request surface of the registry, under the pinned RHINO. The base and head are the pull
      # request's commits, so the public-safety range scan and the commit-message scan see exactly the history the
      # pull request adds.
      - name: Run the pull-request surface under the pinned RHINO
        env:
          RHINO_BASE: ${{ github.event.pull_request.base.sha }}
          RHINO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" \
            ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request --base "$RHINO_BASE" --head "$RHINO_HEAD"

  go-static:
    name: Go lint, typecheck, and audit (${{ matrix.project }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.go-projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      # The setup-go action checks the installed Go against the toolchain line of every go.mod, and keys the module
      # cache on every go.sum, so a library's dependencies are cached as the app's are.
      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      - name: Lint
        run: ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- npx nx run "${PROJECT}:lint"

      - name: Typecheck
        run: ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- npx nx run "${PROJECT}:typecheck"

      # The audit reads the Go vulnerability database over the network, so it stays out of the cached path. It runs
      # only where the project declares the target.
      - name: Dependency audit where the project declares it
        run: |
          set -euo pipefail
          audit="$(./hippo run --class ephemeral --resource-tier light --disk-path . -- \
            npx nx show projects --projects="${PROJECT}" --with-target deps:audit --json)"
          if [ "$audit" != "[]" ]; then
            ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- npx nx run "${PROJECT}:deps:audit"
          fi

  go-unit:
    name: Go unit tests (${{ matrix.project }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.unit-projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      # The unit level is hermetic, and its coverage floor is read from this run alone.
      - name: Unit tests
        run: ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- npx nx run "${PROJECT}:test:unit"

  go-integration:
    name: Go integration tests (${{ matrix.project }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.integration-projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      - name: Integration tests
        run: |
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- \
            npx nx run "${PROJECT}:test:integration"

  go-conformance:
    name: Go conformance tests (${{ matrix.project }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.conformance-projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      - name: Conformance and architecture tests
        run: |
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- \
            npx nx run "${PROJECT}:test:conformance"

  # The platform rows run the application only, on macOS, through the targets whose behaviour depends on the
  # platform: signals, exit statuses, the user configuration directory, atomic renames, file modes, symbolic links,
  # and port binding. A macos-15 runner (3 CPUs, about 7 GiB) has less than the heavy tier's minimum reservation of
  # 4 CPUs and 8192 MiB, so these jobs use the standard tier. The end-to-end suite runs in scheduled-e2e.yml.
  go-unit-macos:
    name: Go unit tests on macOS (${{ matrix.project }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.app-unit-projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      - name: Unit tests on macOS
        run: ./hippo run --class ephemeral --resource-tier standard --disk-path . -- npx nx run "${PROJECT}:test:unit"

  go-conformance-macos:
    name: Go conformance tests on macOS (${{ matrix.project }})
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.app-conformance-projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      - name: Conformance and architecture tests on macOS
        run: |
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            npx nx run "${PROJECT}:test:conformance"

  behaviour-coverage:
    name: Behaviour coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          run-npm-ci: "false"

      # One check for the whole repository, not one per project: a binding and its scenario can sit in any project,
      # so the check is global (rule C7). It reads text and runs no test.
      - name: Validate the behaviour corpus and its bindings
        run: ./hippo run --class ephemeral --resource-tier light --disk-path . -- ./rhino behaviour coverage validate

  cross-compile:
    name: Cross-compile check
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          run-npm-ci: "false"

      - uses: ./.github/actions/setup-go
        with:
          cache-dependency-path: |
            apps/**/go.sum
            libs/**/go.sum

      # Builds only. Binaries go under the runner's temporary directory, and nothing is uploaded or published. The app
      # is the only package built. Its go.mod replace directives name the libraries' folders in this checkout, so the
      # build resolves them from the working tree.
      - name: Cross-compile for the four release platforms
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/cross-compile
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
              env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go -C apps/retriever-cli build -trimpath -o "$OUT_DIR/retriever-${goos}-${goarch}" ./cmd/retriever
          done

  quality-gate:
    name: Quality gate
    # Only an explicit success from every required job may open the merge button. A skipped Go job is a pass only
    # when detection found no affected Go project; every other result fails the aggregate, including a skip caused
    # by a failed dependency.
    needs:
      [
        detect,
        repository-policy,
        go-static,
        go-unit,
        go-integration,
        go-conformance,
        go-unit-macos,
        go-conformance-macos,
        behaviour-coverage,
        cross-compile,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HAS_GO: ${{ needs.detect.outputs.has-go }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Check every gate
        shell: bash
        run: |
          set -euo pipefail
          go_jobs=" go-static go-unit go-integration go-conformance go-unit-macos go-conformance-macos cross-compile "
          failed=0
          while read -r job result; do
            echo "${job}=${result}"
            case "$result" in
              success) ;;
              skipped)
                if [ "$HAS_GO" = "false" ] && [[ "$go_jobs" == *" ${job} "* ]]; then
                  continue
                fi
                failed=1
                ;;
              *) failed=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [ "$failed" -ne 0 ]; then
            echo "A quality gate job did not succeed." >&2
            exit 1
          fi
          echo "All quality gates passed."
