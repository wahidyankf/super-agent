# Example connector spec for retriever. Copy it into the connectors folder, or point --connectors-dir at a folder that holds
# it. Every host and every name is an example: the endpoint suffix is example.test, and the key comes from the variable
# EXAMPLE_WIKI_API_KEY, never from this file. See the add-a-connector how-to for each field.
version: 1
kind: example-wiki
summary: Reads and writes documents of an example wiki.
endpoint:
  base_path: /v1
  host_suffix:
    - .example.test
auth:
  type: bearer
  credential_env: EXAMPLE_WIKI_API_KEY
limits:
  timeout_seconds: 20
  max_pages: 5
operations:
  - id: example-wiki.docs.list
    summary: List documents.
    access: read
    method: GET
    path: /docs
    params:
      - name: cursor
        type: ID
        in: query
        required: false
        help: The cursor of the next page.
      - name: limit
        type: Limit
        in: query
        required: false
        default: 20
    pagination:
      style: cursor
      max_pages: 5
      cursor_param: cursor
      next_pointer: /next_cursor
    response:
      items: /items
      fields:
        id:
          pointer: /id
        title:
          pointer: /title
    examples:
      - request:
          limit: 20
        response:
          status: 200
          body:
            items:
              - id: doc-1
                title: First document
            next_cursor: null
        expect:
          id: doc-1
          title: First document
  - id: example-wiki.docs.create
    summary: Create a document.
    access: write
    method: POST
    path: /docs
    params:
      - name: title
        type: Name
        in: body
        required: true
      - name: text
        type: Text
        in: body
        required: false
    body:
      title: "{{title}}"
      text: "{{text}}"
    response:
      fields:
        id:
          pointer: /id
    examples:
      - request:
          title: First document
          text: Hello
        response:
          status: 201
          body:
            id: doc-2
        expect:
          id: doc-2
  - id: example-wiki.docs.delete
    summary: Delete a document.
    access: write
    method: DELETE
    path: /docs/{id}
    params:
      - name: id
        type: ID
        in: path
        required: true
    response:
      fields: {}
      errors:
        "404": not_found
    examples:
      - request:
          id: doc-1
        response:
          status: 204
        expect: {}
