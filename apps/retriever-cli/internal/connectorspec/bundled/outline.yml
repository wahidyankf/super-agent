        help: the document to change, from collection_tree
      - name: title
        type: Name
        in: body
        required: false
        help: the new title, 1 to 255 characters
      - name: text
        type: Text
        in: body
        required: false
        help: the Markdown text, at most 1 MiB
      - name: editMode
        type: Enum
        in: body
        required: false
        values: [replace, append, prepend, patch]
        help: "how text applies: replace (the default), append, prepend, or patch"
      - name: findText
        type: Query
        in: body
        required: false
        help: "for patch: the text to find and replace in the document"
      - name: lastRevision
        type: Int
        in: body
        required: false
        min: 0
        max: 2147483647
        help: the revision you read, from get_document; the wiki refuses the change if it moved on
      - name: publish
        type: Bool
        in: body
        required: false
        help: true to publish the document
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: the collection to move it into, by its UUID
    body:
      collectionId: "{{collectionId}}"
      editMode: "{{editMode}}"
      findText: "{{findText}}"
      id: "{{documentId}}"
