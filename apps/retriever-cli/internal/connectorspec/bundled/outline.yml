          - reactions.create
          - documents.mentioned
          - comments.mentioned
          - documents.group_mentioned
          - comments.group_mentioned
          - emails.invite_accepted
          - emails.onboarding
          - emails.features
          - emails.export_completed
          - access_requests.create
        help: "the event type to turn on; the wiki's own default when omitted"
    body:
      eventType: "{{eventType}}"
    response:
      fields:
        id: { pointer: /data/id, required: true, format: uuid }
        name: { pointer: /data/name }
        role: { pointer: /data/role }
        isSuspended: { pointer: /data/isSuspended }
        lastActiveAt: { pointer: /data/lastActiveAt }
        createdAt: { pointer: /data/createdAt }
        updatedAt: { pointer: /data/updatedAt }
        deletedAt: { pointer: /data/deletedAt }
        notificationSettings: { pointer: /data/notificationSettings, bool_map: true }
