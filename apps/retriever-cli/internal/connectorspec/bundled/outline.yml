  - id: outline.documents.group-memberships
    summary: list one page of the groups that have access to one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.group_memberships
    catalog_id: documents.group-memberships
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: query
        type: Query
        in: body
        required: false
        help: the group name to search for
      - name: permission
        type: Enum
        in: body
        required: false
        values: [read, read_write, admin]
        help: only items with this permission
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      id: "{{documentId}}"
      query: "{{query}}"
      permission: "{{permission}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data/groupMemberships
      fields:
        id:
          pointer: /id
          required: true
          format: uuid
        groupId: { pointer: /groupId }
        documentId: { pointer: /documentId }
        collectionId: { pointer: /collectionId }
        permission: { pointer: /permission }
        sourceId: { pointer: /sourceId }
    examples:
      - request: { documentId: d1, limit: 25 }
        response:
          status: 200
          body:
            data:
              groupMemberships:
                - id: ex-0001
                  groupId: g1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: ex-0001
  - id: outline.documents.insights
    summary: show the daily view and edit counts of one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.insights
    catalog_id: documents.insights
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: startDate
        type: Time
        in: body
        required: false
        help: "the first day of the window, RFC 3339 with a zone"
      - name: endDate
        type: Time
        in: body
        required: false
        help: "the last day of the window, RFC 3339 with a zone"
    body:
      id: "{{documentId}}"
      startDate: "{{startDate}}"
      endDate: "{{endDate}}"
    response:
      items: /data
      fields:
        date: { pointer: /date }
        period: { pointer: /period }
        viewCount: { pointer: /viewCount }
        viewerCount: { pointer: /viewerCount }
        commentCount: { pointer: /commentCount }
        reactionCount: { pointer: /reactionCount }
        revisionCount: { pointer: /revisionCount }
        editorCount: { pointer: /editorCount }
    examples:
      - request: { documentId: d1 }
        response:
          status: 200
          body:
            data:
              - date: "2026-01-01"
                period: day
                viewCount: 3
                viewerCount: 2
                commentCount: 0
                reactionCount: 0
                revisionCount: 1
                editorCount: 1
        expect:
          date: "2026-01-01"
          viewCount: 3
  - id: outline.documents.memberships
    summary: list one page of the users who have direct access to one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.memberships
    catalog_id: documents.memberships
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: query
        type: Query
        in: body
        required: false
        help: the user name to search for
      - name: permission
        type: Enum
        in: body
        required: false
        values: [read, read_write, admin]
        help: only items with this permission
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      id: "{{documentId}}"
      query: "{{query}}"
      permission: "{{permission}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data/memberships
      fields:
        id:
          pointer: /id
          required: true
          format: uuid
        userId: { pointer: /userId }
        documentId: { pointer: /documentId }
        collectionId: { pointer: /collectionId }
        permission: { pointer: /permission }
        createdById: { pointer: /createdById }
        sourceId: { pointer: /sourceId }
        index: { pointer: /index }
    examples:
      - request: { documentId: d1, limit: 25 }
        response:
          status: 200
          body:
            data:
              memberships:
                - id: ex-0001
                  userId: u1
                  permission: read
            pagination:
              offset: 0
              limit: 25
        expect:
          id: ex-0001
  - id: outline.documents.search-titles
    summary: "search Outline document titles, one page at a time"
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.search_titles
    catalog_id: documents.search-titles
    headers:
      X-API-Version: "2"
    params:
      - name: query
        type: Query
        in: body
        required: true
        help: the text to find in the document titles; it must not be blank
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: documentId
        type: UUID
        in: body
        required: false
        help: "only documents below this document, by its UUID"
      - name: userId
        type: UUID
        in: body
        required: false
        help: "only documents of this user, by the user's UUID"
      - name: statusFilter
        type: EnumList
        in: body
        required: false
        values: [published, archived, draft]
        help: "only published, archived, or draft documents; comma-separated"
      - name: sort
        type: Enum
        in: body
        required: false
        values: [createdAt, updatedAt, title]
        help: "the field to sort by; the server's default when omitted"
      - name: direction
        type: Enum
        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      query: "{{query}}"
      collectionId: "{{collectionId}}"
      documentId: "{{documentId}}"
      userId: "{{userId}}"
      statusFilter: "{{statusFilter}}"
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      errors:
        "404": operation_unavailable
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { query: Setup, limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Setup
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Setup
  - id: outline.documents.users
    summary: list one page of the users who can see one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.users
    catalog_id: documents.users
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: query
        type: Query
        in: body
        required: false
        help: the user name to search for
      - name: userId
        type: UUID
        in: body
        required: false
        help: "only this user, by the user's UUID"
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      id: "{{documentId}}"
      query: "{{query}}"
      userId: "{{userId}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: uuid
        name: { pointer: /name }
        role: { pointer: /role }
        isSuspended: { pointer: /isSuspended }
        lastActiveAt: { pointer: /lastActiveAt }
