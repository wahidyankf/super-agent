      fields:
        id: { pointer: /data/id, required: true, format: uuid }
        type: { pointer: /data/type }
        service: { pointer: /data/service }
        events: { pointer: /data/events, format: strings }
        collectionId: { pointer: /data/collectionId }
        userId: { pointer: /data/userId }
        createdAt: { pointer: /data/createdAt }
        updatedAt: { pointer: /data/updatedAt }
