  - id: outline.webhook-subscriptions.create
    summary: create one Outline webhook subscription that sends events to an address
    access: write
    method: POST
    path: /api/webhookSubscriptions.create
    catalog_id: webhook-subscriptions.create
    headers:
      X-API-Version: "2"
    params:
      - name: url
        type: URL
        in: body
        required: true
        help: the HTTPS address the events are sent to; only its host is shown
      - name: name
        type: Name
        in: body
        required: true
        help: the name of the subscription
      - name: events
        type: EventList
        in: body
        required: true
        help: the event names to send, such as documents.create, or * for every event; separated by commas
    body:
      events: "{{events}}"
      name: "{{name}}"
      url: "{{url}}"
    response:
      fields:
        id:
          pointer: /data/id
          required: true
          format: uuid
        name: { pointer: /data/name }
        urlHost:
          pointer: /data/url
          convert: hostname
        events:
          pointer: /data/events
          format: strings
        enabled: { pointer: /data/enabled }
        createdById: { pointer: /data/createdById }
        createdAt: { pointer: /data/createdAt }
        updatedAt: { pointer: /data/updatedAt }
    examples:
      - request:
          name: Hook
          url: https://hooks.example.test/synthetic/path
          events: [documents.create]
        response:
          status: 200
          body:
            data:
              id: ex-0001
              name: Hook
              url: https://hooks.example.test/synthetic/path
              events:
                - documents.create
              enabled: true
        expect:
          id: ex-0001
          name: Hook
          urlHost: hooks.example.test
