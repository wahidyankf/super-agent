version: 1
kind: outline
summary: Reads of an Outline wiki.
endpoint: {}
auth:
  type: bearer
  credential_env: OUTLINE_API_KEY
operations:
  - id: outline.collections.list
    summary: list the collections of the Outline wiki
    access: read
    method: POST
    read_over_post: true
    path: /api/collections.list
    catalog_id: collections.list
    headers:
      X-API-Version: "2"
    body: {}
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        name: { pointer: /name }
    examples:
      - request: {}
        response:
          status: 200
          body:
            data:
              - id: c1
                name: General
        expect:
          id: c1
          name: General
  - id: outline.collections.info
    summary: show the ID and name of one Outline collection
    access: read
    method: POST
    read_over_post: true
    path: /api/collections.info
    catalog_id: collections.info
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionID
        in: body
        required: true
        help: "the collection ID, from list_collections"
    body:
      id: "{{collectionId}}"
    response:
      fields:
        id:
          pointer: /data/id
          required: true
          format: id
        name: { pointer: /data/name }
    examples:
      - request: { collectionId: c1 }
        response:
          status: 200
          body:
            data:
              id: c1
              name: General
        expect:
          id: c1
          name: General
  - id: outline.collections.documents
    summary: show the document tree of one Outline collection
    access: read
    method: POST
    read_over_post: true
    path: /api/collections.documents
    catalog_id: collections.documents
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionID
        in: body
        required: true
        help: "the collection ID, from list_collections"
    body:
      id: "{{collectionId}}"
    response:
      items: /data
      tree:
        children: /children
        parent_field: parentId
        depth_field: depth
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
    examples:
      - request: { collectionId: c1 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Setup
                url: /doc/d1
                children:
                  - id: d2
                    title: Child
                    url: /doc/d2
        expect:
          id: d1
          title: Setup
          parentId: null
          depth: 0
  - id: outline.documents.get
    summary: print the Markdown of one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.info
    catalog_id: documents.get
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from collection_tree"
    body:
      id: "{{documentId}}"
    response:
      markdown: markdown
      fields:
        id:
          pointer: /data/id
          required: true
          format: id
        title: { pointer: /data/title }
        url: { pointer: /data/url }
        collectionId: { pointer: /data/collectionId }
        revision: { pointer: /data/revision }
        markdown: { pointer: /data/text }
    fallback:
      operation: outline.documents.export
      when:
        empty: markdown
      fill: [markdown]
    examples:
      - request: { documentId: d1 }
        response:
          status: 200
          body:
            data:
              id: d1
              title: Setup
              url: /doc/d1
              collectionId: c1
              revision: 1
              text: Hello
        expect:
          id: d1
          title: Setup
          markdown: Hello
  - id: outline.documents.list
    summary: list one page of Outline documents
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.list
    catalog_id: documents.list
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first document to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "documents per page, from 1 to 100; 25 when omitted"
    body:
      collectionId: "{{collectionId}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Setup
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Setup
  - id: outline.documents.search
    summary: "search Outline documents by title and text, one page at a time"
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.search
    catalog_id: documents.search
    headers:
      X-API-Version: "2"
    params:
      - name: query
        type: Query
        in: body
        required: true
        help: the text to find in the document titles and texts
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first match to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "matches per page, from 1 to 100; 25 when omitted"
    body:
      query: "{{query}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      errors:
        "404": operation_unavailable
      fields:
        id:
          pointer: /document/id
          required: true
          format: id
        title: { pointer: /document/title }
        url: { pointer: /document/url }
        collectionId: { pointer: /document/collectionId }
    examples:
      - request: { query: Setup, limit: 25 }
        response:
          status: 200
          body:
            data:
              - document:
                  id: d1
                  title: Setup
                  url: /doc/d1
                  collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Setup
  - id: outline.auth.whoami
    summary: show the user and team that the Outline API key belongs to
    access: read
    method: POST
    read_over_post: true
    path: /api/auth.info
    catalog_id: auth.whoami
    headers:
      X-API-Version: "2"
    body: {}
    response:
      errors:
        "404": operation_unavailable
      fields:
        user:
          object:
            id: { pointer: /data/user/id }
            name: { pointer: /data/user/name }
        team:
          object:
            name: { pointer: /data/team/name }
    examples:
      - request: {}
        response:
          status: 200
          body:
            data:
              user:
                id: u1
                name: Ada
              team:
                id: t1
                name: Team
        expect:
          user:
            id: u1
            name: Ada
  - id: outline.documents.archived
    summary: list one page of archived Outline documents
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.archived
    catalog_id: documents.archived
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: sort
        type: Enum
        in: body
        required: false
        values: [createdAt, updatedAt, publishedAt, index, title, popularityScore]
        help: "the field to sort by; the server's default when omitted"
      - name: direction
        type: Enum
        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      collectionId: "{{collectionId}}"
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Old
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Old
  - id: outline.documents.children
    summary: "show the documents below one Outline document, as a tree"
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.documents
    catalog_id: documents.children
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
    body:
      id: "{{documentId}}"
    response:
      items: /data/children
      tree:
        children: /children
        parent_field: parentId
        depth_field: depth
        root_parent_param: documentId
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
    examples:
      - request: { documentId: d1 }
        response:
          status: 200
          body:
            data:
              id: d1
              children:
                - id: d2
                  title: Child
                  url: /doc/d2
        expect:
          id: d2
          title: Child
          parentId: d1
          depth: 0
  - id: outline.documents.deleted
    summary: list one page of deleted Outline documents
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.deleted
    catalog_id: documents.deleted
    headers:
      X-API-Version: "2"
    params:
      - name: sort
        type: Enum
        in: body
        required: false
        values: [createdAt, updatedAt, publishedAt, index, title, popularityScore]
        help: "the field to sort by; the server's default when omitted"
      - name: direction
        type: Enum
        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Gone
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Gone
  - id: outline.documents.drafts
    summary: list one page of Outline draft documents
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.drafts
    catalog_id: documents.drafts
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: sort
        type: Enum
        in: body
        required: false
        values: [createdAt, updatedAt, publishedAt, index, title, popularityScore]
        help: "the field to sort by; the server's default when omitted"
      - name: direction
        type: Enum
        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      collectionId: "{{collectionId}}"
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Draft
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Draft
  - id: outline.documents.group-memberships
    summary: list one page of the groups that have access to one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.group_memberships
    catalog_id: documents.group-memberships
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: query
        type: Query
        in: body
        required: false
        help: the group name to search for
      - name: permission
        type: Enum
        in: body
        required: false
        values: [read, read_write, admin]
        help: only items with this permission
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      id: "{{documentId}}"
      query: "{{query}}"
      permission: "{{permission}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data/groupMemberships
      fields:
        id:
          pointer: /id
          required: true
          format: uuid
        groupId: { pointer: /groupId }
        documentId: { pointer: /documentId }
        collectionId: { pointer: /collectionId }
        permission: { pointer: /permission }
        sourceId: { pointer: /sourceId }
    examples:
      - request: { documentId: d1, limit: 25 }
        response:
          status: 200
          body:
            data:
              groupMemberships:
                - id: ex-0001
                  groupId: g1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: ex-0001
  - id: outline.documents.insights
    summary: show the daily view and edit counts of one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.insights
    catalog_id: documents.insights
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: startDate
        type: Time
        in: body
        required: false
        help: "the first day of the window, RFC 3339 with a zone"
      - name: endDate
        type: Time
        in: body
        required: false
        help: "the last day of the window, RFC 3339 with a zone"
    body:
      id: "{{documentId}}"
      startDate: "{{startDate}}"
      endDate: "{{endDate}}"
    response:
      items: /data
      fields:
        date: { pointer: /date }
        period: { pointer: /period }
        viewCount: { pointer: /viewCount }
        viewerCount: { pointer: /viewerCount }
        commentCount: { pointer: /commentCount }
        reactionCount: { pointer: /reactionCount }
        revisionCount: { pointer: /revisionCount }
        editorCount: { pointer: /editorCount }
    examples:
      - request: { documentId: d1 }
        response:
          status: 200
          body:
            data:
              - date: "2026-01-01"
                period: day
                viewCount: 3
                viewerCount: 2
                commentCount: 0
                reactionCount: 0
                revisionCount: 1
                editorCount: 1
        expect:
          date: "2026-01-01"
          viewCount: 3
  - id: outline.documents.memberships
    summary: list one page of the users who have direct access to one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.memberships
    catalog_id: documents.memberships
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: query
        type: Query
        in: body
        required: false
        help: the user name to search for
      - name: permission
        type: Enum
        in: body
        required: false
        values: [read, read_write, admin]
        help: only items with this permission
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      id: "{{documentId}}"
      query: "{{query}}"
      permission: "{{permission}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data/memberships
      fields:
        id:
          pointer: /id
          required: true
          format: uuid
        userId: { pointer: /userId }
        documentId: { pointer: /documentId }
        collectionId: { pointer: /collectionId }
        permission: { pointer: /permission }
        createdById: { pointer: /createdById }
        sourceId: { pointer: /sourceId }
        index: { pointer: /index }
    examples:
      - request: { documentId: d1, limit: 25 }
        response:
          status: 200
          body:
            data:
              memberships:
                - id: ex-0001
                  userId: u1
                  permission: read
            pagination:
              offset: 0
              limit: 25
        expect:
          id: ex-0001
  - id: outline.documents.search-titles
    summary: "search Outline document titles, one page at a time"
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.search_titles
    catalog_id: documents.search-titles
    headers:
      X-API-Version: "2"
    params:
      - name: query
        type: Query
        in: body
        required: true
        help: the text to find in the document titles; it must not be blank
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: documentId
        type: UUID
        in: body
        required: false
        help: "only documents below this document, by its UUID"
      - name: userId
        type: UUID
        in: body
        required: false
        help: "only documents of this user, by the user's UUID"
      - name: statusFilter
        type: EnumList
        in: body
        required: false
        values: [published, archived, draft]
        help: "only published, archived, or draft documents; comma-separated"
      - name: sort
        type: Enum
        in: body
        required: false
        values: [createdAt, updatedAt, title]
        help: "the field to sort by; the server's default when omitted"
      - name: direction
        type: Enum
        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      query: "{{query}}"
      collectionId: "{{collectionId}}"
      documentId: "{{documentId}}"
      userId: "{{userId}}"
      statusFilter: "{{statusFilter}}"
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      errors:
        "404": operation_unavailable
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { query: Setup, limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Setup
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Setup
  - id: outline.documents.users
    summary: list one page of the users who can see one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.users
    catalog_id: documents.users
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
      - name: query
        type: Query
        in: body
        required: false
        help: the user name to search for
      - name: userId
        type: UUID
        in: body
        required: false
        help: "only this user, by the user's UUID"
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      id: "{{documentId}}"
      query: "{{query}}"
      userId: "{{userId}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: uuid
        name: { pointer: /name }
        role: { pointer: /role }
        isSuspended: { pointer: /isSuspended }
        lastActiveAt: { pointer: /lastActiveAt }
        createdAt: { pointer: /createdAt }
        updatedAt: { pointer: /updatedAt }
        deletedAt: { pointer: /deletedAt }
    examples:
      - request: { documentId: d1, limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: ex-0001
                name: Ada
                role: member
            pagination:
              offset: 0
              limit: 25
        expect:
          id: ex-0001
          name: Ada
  - id: outline.documents.viewed
    summary: "list one page of the Outline documents the API key's user has viewed"
    access: read
