version: 1
kind: outline
summary: Reads, writes, and admin operations of an Outline wiki.
endpoint: {}
auth:
  type: bearer
  credential_env: OUTLINE_API_KEY
operations:
  - id: outline.collections.list
    summary: list the collections of the Outline wiki
    access: read
    method: POST
    read_over_post: true
    path: /api/collections.list
    catalog_id: collections.list
    headers:
      X-API-Version: "2"
    body: {}
    pagination:
      style: page-all
      in: body
      max_pages: 20
      page_size: 25
    role: list-collections
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        name: { pointer: /name }
    examples:
      - request: {}
        response:
          status: 200
          body:
            data:
              - id: c1
                name: General
        expect:
          id: c1
          name: General
  - id: outline.collections.info
    summary: show the ID and name of one Outline collection
    access: read
    method: POST
    read_over_post: true
    path: /api/collections.info
    catalog_id: collections.info
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionID
        in: body
        required: true
        help: "the collection ID, from list_collections"
    body:
      id: "{{collectionId}}"
    response:
      fields:
        id:
          pointer: /data/id
          required: true
          format: id
        name: { pointer: /data/name }
    examples:
      - request: { collectionId: c1 }
        response:
          status: 200
          body:
            data:
              id: c1
              name: General
        expect:
          id: c1
          name: General
  - id: outline.collections.documents
    summary: show the document tree of one Outline collection
    access: read
    method: POST
    read_over_post: true
    path: /api/collections.documents
    catalog_id: collections.documents
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionID
        in: body
        required: true
        help: "the collection ID, from list_collections"
    body:
      id: "{{collectionId}}"
    response:
      items: /data
      tree:
        children: /children
        parent_field: parentId
        depth_field: depth
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
    examples:
      - request: { collectionId: c1 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Setup
                url: /doc/d1
                children:
                  - id: d2
                    title: Child
                    url: /doc/d2
        expect:
          id: d1
          title: Setup
          parentId: null
          depth: 0
  - id: outline.documents.get
    summary: print the Markdown of one Outline document
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.info
    catalog_id: documents.get
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from collection_tree"
    body:
      id: "{{documentId}}"
    response:
      markdown: markdown
      errors:
        "404": not_found
      unavailable_message: Endpoint not found
      fields:
        id:
          pointer: /data/document/id
          fallback_pointer: /data/id
          required: true
          format: id
        title:
          pointer: /data/document/title
          fallback_pointer: /data/title
        url:
          pointer: /data/document/url
          fallback_pointer: /data/url
        collectionId:
          pointer: /data/document/collectionId
          fallback_pointer: /data/collectionId
        revision:
          pointer: /data/document/revision
          fallback_pointer: /data/revision
        markdown:
          pointer: /data/document/text
          fallback_pointer: /data/text
    fallback:
      operation: outline.documents.export
      when:
        empty: markdown
      fill: [markdown]
    examples:
      - request: { documentId: d1 }
        response:
          status: 200
          body:
            data:
              id: d1
              title: Setup
              url: /doc/d1
              collectionId: c1
              revision: 1
              text: Hello
        expect:
          id: d1
          title: Setup
          markdown: Hello
  - id: outline.documents.list
    summary: list one page of Outline documents
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.list
    catalog_id: documents.list
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first document to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "documents per page, from 1 to 100; 25 when omitted"
    body:
      collectionId: "{{collectionId}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Setup
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Setup
  - id: outline.documents.search
    summary: "search Outline documents by title and text, one page at a time"
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.search
    catalog_id: documents.search
    headers:
      X-API-Version: "2"
    params:
      - name: query
        type: Query
        in: body
        required: true
        help: the text to find in the document titles and texts
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first match to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "matches per page, from 1 to 100; 25 when omitted"
    body:
      query: "{{query}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      errors:
        "404": operation_unavailable
      fields:
        id:
          pointer: /document/id
          required: true
          format: id
        title: { pointer: /document/title }
        url: { pointer: /document/url }
        collectionId: { pointer: /document/collectionId }
    examples:
      - request: { query: Setup, limit: 25 }
        response:
          status: 200
          body:
            data:
              - document:
                  id: d1
                  title: Setup
                  url: /doc/d1
                  collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Setup
  - id: outline.auth.whoami
    summary: show the user and team that the Outline API key belongs to
    access: read
    method: POST
    read_over_post: true
    path: /api/auth.info
    catalog_id: auth.whoami
    headers:
      X-API-Version: "2"
    body: {}
    response:
      errors:
        "404": operation_unavailable
      fields:
        user:
          object:
            id: { pointer: /data/user/id }
            name: { pointer: /data/user/name }
        team:
          object:
            name: { pointer: /data/team/name }
    examples:
      - request: {}
        response:
          status: 200
          body:
            data:
              user:
                id: u1
                name: Ada
              team:
                id: t1
                name: Team
        expect:
          user:
            id: u1
            name: Ada
  - id: outline.documents.archived
    summary: list one page of archived Outline documents
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.archived
    catalog_id: documents.archived
    headers:
      X-API-Version: "2"
    params:
      - name: collectionId
        type: CollectionUUID
        in: body
        required: false
        help: "only documents of this collection, by its UUID"
      - name: sort
        type: Enum
        in: body
        required: false
        values: [createdAt, updatedAt, publishedAt, index, title, popularityScore]
        help: "the field to sort by; the server's default when omitted"
      - name: direction
        type: Enum
        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      collectionId: "{{collectionId}}"
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Old
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Old
  - id: outline.documents.children
    summary: "show the documents below one Outline document, as a tree"
    access: read
    method: POST
    read_over_post: true
    path: /api/documents.documents
    catalog_id: documents.children
    headers:
      X-API-Version: "2"
    params:
      - name: documentId
        type: DocumentID
        in: body
        required: true
        help: "the document ID, from list_documents"
    body:
      id: "{{documentId}}"
    response:
      items: /data/children
      tree:
        children: /children
        parent_field: parentId
        depth_field: depth
        root_parent_param: documentId
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
    examples:
      - request: { documentId: d1 }
        response:
          status: 200
          body:
            data:
              id: d1
              children:
                - id: d2
                  title: Child
                  url: /doc/d2
        expect:
          id: d2
          title: Child
          parentId: d1
          depth: 0
