        in: body
        required: false
        values: [ASC, DESC]
        help: ASC or DESC; DESC when omitted
      - name: offset
        type: Offset
        in: body
        required: false
        default: 0
        help: the first item to return; 0 when omitted
      - name: limit
        type: Limit
        in: body
        required: false
        default: 25
        help: "items per page, from 1 to 100; 25 when omitted"
    body:
      sort: "{{sort}}"
      direction: "{{direction}}"
      offset: "{{offset}}"
      limit: "{{limit}}"
    pagination:
      style: offset
      in: body
      max_pages: 1
      limit_param: limit
      offset_param: offset
    response:
      items: /data
      fields:
        id:
          pointer: /id
          required: true
          format: id
        title: { pointer: /title }
        url: { pointer: /url }
        collectionId: { pointer: /collectionId }
    examples:
      - request: { limit: 25 }
        response:
          status: 200
          body:
            data:
              - id: d1
                title: Gone
                url: /doc/d1
                collectionId: c1
            pagination:
              offset: 0
              limit: 25
        expect:
          id: d1
          title: Gone
  - id: outline.documents.drafts
